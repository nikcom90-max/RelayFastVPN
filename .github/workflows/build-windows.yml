name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pillow (для иконки)
        shell: bash
        run: python -m pip install --quiet pillow

      - name: Bootstrap Windows project
        shell: bash
        run: bash tools/bootstrap_windows.sh

      - name: Core (Xray + Wintun + geo)
        shell: pwsh
        run: ./tools/fetch_windows_core.ps1

      - name: Test
        shell: bash
        run: |
          flutter pub get
          flutter test

      - name: Build Windows
        shell: bash
        run: flutter build windows --release --build-number=${{ github.run_number }} --dart-define=UPDATE_REPO=${{ github.repository }} --dart-define=BILLING_URL=${{ secrets.BILLING_URL }}

      - name: Package (portable ZIP + installer)
        shell: pwsh
        env:
          RF_VERSION: 1.0.${{ github.run_number }}
        run: |
          $rel = 'build\windows\x64\runner\Release'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # portable zip: RelayFastVPN\RelayFastVPN.exe + core\
          $stage = 'dist\stage\RelayFastVPN'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$rel\*" $stage -Recurse -Force
          Copy-Item 'core' "$stage\core" -Recurse -Force
          Compress-Archive -Path 'dist\stage\RelayFastVPN' -DestinationPath 'dist\RelayFastVPN-windows-portable.zip' -Force
          Remove-Item 'dist\stage' -Recurse -Force

          # installer (Inno Setup)
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup не найден' }
          & $iscc 'windows_installer\relayfast.iss'
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: RelayFastVPN-windows
          path: dist/*

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "windows-${{ github.run_number }}" \
            dist/RelayFastVPN-Setup.exe dist/RelayFastVPN-windows-portable.zip \
            --title "RelayFastVPN для Windows, сборка ${{ github.run_number }}" \
            --notes "Автосборка из ${{ github.sha }}" \
            --target "${{ github.sha }}"
